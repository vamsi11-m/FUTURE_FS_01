<!DOCTYPE html>
<html>
<head>
<title>ToDo App</title>

<style>

body{
font-family:Arial;
background:#f4f4f4;
text-align:center;
padding:40px;
}

.container{
background:white;
padding:20px;
border-radius:10px;
max-width:400px;
margin:auto;
}

input{
width:70%;
padding:10px;
}

button{
padding:10px;
background:green;
color:white;
border:none;
cursor:pointer;
}

li{
margin:10px;
}

</style>
</head>

<body>

<div class="container">

<h1>ToDo App</h1>

<input type="text" id="task">

<button onclick="addTask()">Add</button>

<ul id="list"></ul>

</div>

<script>

function addTask(){

let task=document.getElementById("task").value;

if(task==="") return;

let li=document.createElement("li");

li.innerText=task;

document.getElementById("list").appendChild(li);

document.getElementById("task").value="";

}

</script>

</body>
</html>
